<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand"> Notes App</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Notes</h2>
            <a href="/notes/create/" class="btn btn-success">+ Add Note</a>
        </div>

        {% for note in notes %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ note.title }}</h5>
                <p class="card-text text-muted">{{ note.content }}</p>
                <a href="/notes/edit/{{ note.id }}/" class="btn btn-primary btn-sm me-2">Edit</a>
                <a href="/notes/delete/{{ note.id }}/" class="btn btn-danger btn-sm">Delete</a>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-muted">No notes yet!</p>
        {% endfor %}
    </div>
</body>
</html>
